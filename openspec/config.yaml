schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Tech stack: Rust backend/service in `src-tauri/`. Tests: `cargo test`.
  Conventional commit messages (feat:, fix:, docs(spec):, etc.).
  Domain: backend service and CLI for local AI tools, plugins, skills, slash
  commands, optional A2A server, and token-authenticated HTTP APIs.
  User config lives under `~/.config/omnilauncher/`; runtime data under
  `~/.omnilauncher/`.

