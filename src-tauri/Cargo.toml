[package]
name = "omnilauncher"
version = "2.0.0"
edition = "2021"

[lib]
name = "omnilauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "omnilauncher"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
dirs = "5"
walkdir = "2"
regex = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
