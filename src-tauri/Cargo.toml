[package]
name = "omnilauncher"
version = "2.0.0"
edition = "2021"

[lib]
name = "omnilauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "omnilauncher"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
async-trait = "0.1"
dirs = "5"
walkdir = "2"
regex = "1"
glob = "0.3"
sysinfo = "0.30"
log = "0.4"
simplelog = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
