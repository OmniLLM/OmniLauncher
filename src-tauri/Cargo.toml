[package]
name = "omnilauncher"
version = "2.0.0"
edition = "2021"

[lib]
name = "omnilauncher_lib"
path = "src/lib.rs"

[[bin]]
name = "omnilauncher"
path = "src/main.rs"

[dependencies]
rayon = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
futures-util = "0.3"
dirs = "5"
walkdir = "2"
regex = "1"
glob = "0.3"
sysinfo = "0.30"
log = "0.4"
simplelog = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
rand = "0.8"
clap = "4.5"
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
http = "1"
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "2.2", default-features = false, features = ["client", "auth", "transport-streamable-http-client-reqwest", "reqwest"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.dev]
# Faster local iteration: less debug info, keep incremental compilation enabled.
debug = 1
incremental = true

[profile.test]
# Keep test binaries quick to compile while preserving useful backtraces.
debug = 1
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
